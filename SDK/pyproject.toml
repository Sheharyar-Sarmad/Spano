[project]
name = "spano"
version = "0.1.0"
description = "Python SDK for tracing and exporting AI-agent execution telemetry"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Spano contributors" }]
keywords = ["ai-agents", "observability", "tracing", "llm", "telemetry"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
]
dependencies = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/spano"]

[dependency-groups]
dev = ["pytest>=8.0", "build>=1.0"]

[tool.pytest.ini_options]
testpaths = ["test"]
